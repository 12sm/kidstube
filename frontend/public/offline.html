<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KidsTube – Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f0f0f;
      color: #f1f1f1;
      font-family: 'Roboto', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px;
      text-align: center;
    }
    img { width: 72px; height: 72px; opacity: 0.6; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p  { font-size: 0.875rem; color: #aaa; max-width: 280px; line-height: 1.5; }
    button {
      margin-top: 8px;
      padding: 10px 28px;
      border-radius: 999px;
      background: #ff0000;
      color: white;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #cc0000; }
  </style>
</head>
<body>
  <img src="/icon-192.png" alt="KidsTube" />
  <h1>You're offline</h1>
  <p>Connect to Wi-Fi or mobile data to watch videos.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
