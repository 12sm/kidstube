services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kidstube-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    networks:
      - kidstube-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: kidstube-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - kidstube-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Invidious — YouTube stream resolver for Roku playback
  invidious:
    image: quay.io/invidious/invidious:latest
    container_name: kidstube-invidious
    restart: unless-stopped
    ports:
      - "3080:3000"
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: kemal
          host: invidious-db
          port: 5432
        check_tables: true
        hmac_key: REDACTED_HMAC_KEY
        invidious_companion:
          - private_url: "http://companion:8282/companion"
        invidious_companion_key: "REDACTED_COMPANION_KEY"
        external_port: 3080
        domain: LAN_IP:3080
        https_only: false
        popular_enabled: false
        registration_enabled: false
    depends_on:
      invidious-db:
        condition: service_healthy
    networks:
      - kidstube-network
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1
      interval: 30s
      timeout: 5s
      retries: 2
    logging:
      options:
        max-size: "1G"
        max-file: "4"

  companion:
    image: quay.io/invidious/invidious-companion:latest
    container_name: kidstube-companion
    restart: unless-stopped
    environment:
      - SERVER_SECRET_KEY=REDACTED_COMPANION_KEY
    cap_drop:
      - ALL
    read_only: true
    volumes:
      - companion-cache:/var/tmp/youtubei.js:rw
    security_opt:
      - no-new-privileges:true
    networks:
      - kidstube-network
    logging:
      options:
        max-size: "1G"
        max-file: "4"

  invidious-db:
    image: docker.io/library/postgres:14
    container_name: kidstube-invidious-db
    restart: unless-stopped
    volumes:
      - invidious-db-data:/var/lib/postgresql/data
      - ./invidious-repo/config/sql:/config/sql
      - ./invidious-repo/docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: kemal
    networks:
      - kidstube-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  invidious-db-data:
  companion-cache:

networks:
  kidstube-network:
    driver: bridge
